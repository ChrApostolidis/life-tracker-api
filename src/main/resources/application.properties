
spring.datasource.url=jdbc:sqlite:${DB_PATH:lifetracker.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema; Hibernate only checks the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Pre-Flyway DBs (created by ddl-auto=update) get marked at version 1 without
# running V1, then newer migrations apply on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.api-token=dev-token-123
# Origins allowed to call /api/**, read once by config/CorsConfig. The extension ID is
# pinned by the "key" in the web repo's extension/manifest.json, so it is stable.
app.cors.allowed-origins=http://localhost:3000,https://lifetracker.christosapostolidis.com,chrome-extension://mdaedeaeglbngaelofpcpjgkjcigbphg
# Zone recurring-task expansion and the overdue cutoff are computed in.
app.timezone=Europe/Athens
