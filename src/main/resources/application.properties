
spring.datasource.url=jdbc:sqlite:${DB_PATH:lifetracker.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema; Hibernate only checks the mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Pre-Flyway DBs (created by ddl-auto=update) get marked at version 1 without
# running V1, then newer migrations apply on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.api-token=dev-token-123
