# Test-only config: shadows the main application.properties so tests never touch
# the real dev DB (lifetracker.db). A file under target/ because SQLite in-memory
# DBs are per-connection (Flyway and Hibernate would each see their own empty DB);
# `mvnw clean` wipes it.
spring.datasource.url=jdbc:sqlite:target/lifetracker-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.api-token=test-token
